<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5 Minute English Talk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <a class="back" href="../">← 홈으로</a>
    <h1>5 Minute English Talk 🎧</h1>
    <p class="intro">
      에피소드별 스크립트 모음이에요.
      <a href="https://podcasts.apple.com/us/podcast/5-minute-english-talk/id1820739470" target="_blank" rel="noopener">팟캐스트 듣기 ↗</a>
    </p>

    <input type="search" id="q" placeholder="제목으로 검색" aria-label="제목으로 검색">
    <p class="status" id="status">불러오는 중…</p>
    <ul class="episodes" id="list"></ul>
  </main>

  <script>
    // Lists every .md file in ./episodes via the GitHub API, so uploading a
    // new file to that folder is enough to make it appear here.
    const API = "https://api.github.com/repos/psh2hero/psh2hero.github.io/contents/5min-english/episodes";

    function toTitle(name) {
      // "2026-10-01_how-to-keep-a-conversation-going-in-english.md" -> "How to keep a conversation going in English"
      const slug = name.replace(/\.md$/, "").replace(/^\d{4}-\d{2}-\d{2}_?/, "");
      const s = slug.replace(/-/g, " ").replace(/\benglish\b/g, "English").replace(/\bi\b/g, "I");
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function render(files, query) {
      const list = document.getElementById("list");
      const status = document.getElementById("status");
      const q = query.trim().toLowerCase();
      const shown = files.filter(f => f.title.toLowerCase().includes(q));
      list.innerHTML = "";
      for (const f of shown) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.className = "menu";
        a.href = "view.html?f=" + encodeURIComponent(f.name);
        const date = document.createElement("span");
        date.className = "date";
        date.textContent = f.date || "—";
        const title = document.createElement("span");
        title.className = "title";
        title.textContent = f.title;
        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "›";
        a.append(date, title, arrow);
        li.append(a);
        list.append(li);
      }
      status.textContent = files.length
        ? `총 ${files.length}개 에피소드` + (q ? ` · 검색 결과 ${shown.length}개` : "")
        : "아직 스크립트가 없어요.";
    }

    fetch(API)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(items => {
        const files = items
          .filter(i => i.type === "file" && i.name.endsWith(".md"))
          .map(i => ({
            name: i.name,
            date: (i.name.match(/^\d{4}-\d{2}-\d{2}/) || [""])[0],
            title: toTitle(i.name),
          }))
          .sort((a, b) => b.name.localeCompare(a.name));
        const q = document.getElementById("q");
        q.addEventListener("input", () => render(files, q.value));
        render(files, "");
      })
      .catch(() => {
        document.getElementById("status").textContent =
          "목록을 불러오지 못했어요. 잠시 후 새로고침해 주세요.";
      });
  </script>
</body>
</html>
