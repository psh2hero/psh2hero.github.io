<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Episode Script</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.14/lib/marked.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.16/purify.min.js"></script>
</head>
<body>
  <main>
    <a class="back" href="./">← 에피소드 목록</a>
    <article id="content"><p class="status">불러오는 중…</p></article>
  </main>

  <script>
    const el = document.getElementById("content");
    const f = new URLSearchParams(location.search).get("f") || "";

    // Only allow plain .md filenames inside ./episodes.
    if (!/^[\w.-]+\.md$/.test(f)) {
      el.innerHTML = '<p class="status">에피소드를 찾을 수 없어요.</p>';
    } else {
      fetch("episodes/" + encodeURIComponent(f))
        .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(md => {
          el.innerHTML = DOMPurify.sanitize(marked.parse(md));
          el.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
          const h1 = el.querySelector("h1");
          if (h1) document.title = h1.textContent + " · 5 Minute English Talk";
        })
        .catch(() => {
          el.innerHTML = '<p class="status">스크립트를 불러오지 못했어요.</p>';
        });
    }
  </script>
</body>
</html>
