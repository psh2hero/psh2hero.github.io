<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>박상형의 페이지</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --card: #ffffff;
      --ink: #2b2723;
      --muted: #7a7168;
      --line: #e6dfd4;
      --accent: #c0563f;
      --accent-soft: #fbeae5;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1a18; --card: #26231f; --ink: #ece6dc; --muted: #a49a8e;
        --line: #3a352f; --accent: #e8826b; --accent-soft: #3a2621;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
            "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; padding: 56px 16px 80px; }
    h1 { font-size: 1.9rem; margin: 0 0 4px; }
    .intro { color: var(--muted); margin: 0 0 40px; }
    section { margin-bottom: 32px; }
    h2 {
      font-size: 0.95rem; letter-spacing: 0.04em; color: var(--muted);
      margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
    }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    a.menu {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 18px; background: var(--card); color: inherit; text-decoration: none;
      border: 1px solid var(--line); border-radius: 12px;
      transition: border-color .15s, transform .15s;
    }
    a.menu:hover { border-color: var(--accent); transform: translateY(-1px); }
    .icon {
      flex: none; width: 40px; height: 40px; border-radius: 10px;
      display: grid; place-items: center; font-size: 1.25rem;
      background: var(--accent-soft);
    }
    .title { font-weight: 600; }
    .desc { color: var(--muted); font-size: 0.9rem; }
    .arrow { margin-left: auto; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>안녕하세요, 박상형입니다 👋</h1>
    <p class="intro">공부하고 기록하는 공간이에요.</p>

    <section>
      <h2>영어</h2>
      <ul>
        <li>
          <a class="menu" href="5min-english/">
            <span class="icon">🎧</span>
            <span>
              <span class="title">5 Minute English Talk</span><br>
              <span class="desc">팟캐스트 에피소드별 스크립트</span>
            </span>
            <span class="arrow">›</span>
          </a>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
